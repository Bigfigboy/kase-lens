function simulate({capital,allocation,shock,price}){
  const cleanCapital=Math.max(0,Number(capital)||0);
  const exposure=cleanCapital*Math.min(100,Math.max(0,Number(allocation)||0))/100;
  const p=Number(price);
  if(!(p>0)) return {shares:0, invested:0,cash:cleanCapital,newPrice:0,ending:cleanCapital,pnl:0};
  const shares=Math.floor(exposure/p);
  const invested=shares*p;
  const cash=cleanCapital-invested;
  const newPrice=Math.max(0,p*(1+Math.max(-100,Number(shock)||0)/100));
  const ending=cash+shares*newPrice;
  return {shares,invested,cash,newPrice,ending,pnl:ending-cleanCapital};
}

nly with local Ollama"':''} aria-label="Send">${I('arrow',19)}</button></div><p>${I('info',13)} ${t('noLive')}</p></form></div><aside class="question-side"><div class="question-side-title"><span>${t('queryTitle')}</span>${I('target',19)}</div><div class="suggestion-list">${questionCards()}</div><div class="side-trust"><div>${I('shield',20)} <strong>${t('sourcePanel')}</strong></div><p>${t('coreDesc')}</p><button class="mini-source" data-view="sources">${t('explainMore')} ${I('right',15)}</button></div></aside></div></div>`}
function filteredStocks(){let arr=[...STOCKS].filter(s=>[s.name,s.ticker,s.sector].join(' ').toLowerCase().includes(state.filter.toLowerCase()));return state.sort==='change'?arr.sort((a,b)=>deltaPct(b.p19,b.p20)-deltaPct(a.p19,a.p20)):arr.sort((a,b)=>a.ticker.localeCompare(b.ticker))}
function marketSelected(){let s=STOCKS.find(x=>x.ticker===state.detail)||STOCKS[0],d=deltaPct(s.p19,s.p20);return `<div class="detail-panel"><div class="detail-top"><span class="section-kicker">${t('marketSelected')}</span>${pill('KASE · '+dateText,'green')}</div><div class="detail-identity"><div class="ticker-emblem">${esc(s.ticker.substring(0,2))}</div><div><h3>${esc(s.name)}</h3><span>${esc(s.ticker)} <span class="separator-dot">·</span> ${esc(s.sector)}</span></div></div><div class="detail-price">${money(s.p20)} <small>₸</small></div>${marketBadge(s)}<div class="two-point-chart"><div class="chart-guide"><span>${money(Math.max(s.p19,s.p20))} ₸</span><span>${money(Math.min(s.p19,s.p20))} ₸</span></div>${(()=>{let top=Math.max(s.p19,s.p20),bottom=Math.min(s.p19,s.p20),y1=top===bottom?50:(top-s.p19)/(top-bottom)*70+15,y2=top===bottom?50:(top-s.p20)/(top-bottom)*70+15,color=d>=0?'#52e3a6':'#fc8f91';return `<svg viewBox="0 0 400 140" preserveAspectRatio="none" aria-label="Two recorded closing prices"><path d="M0 25H400M0 75H400M0 125H400" class="chart-grid"/><path d="M35 ${y1} L365 ${y2}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="35" cy="${y1}" r="6" fill="${color}"/><circle cx="365" cy="${y2}" r="6" fill="${color}"/></svg>`})()}<div class="two-point-labels"><span>19 OCT<br><b>${money(s.p19)}</b></span><span>20 OCT<br><b>${money(s.p20)}</b></span></div></div><div class="detail-facts"><div><span>19.10</span><strong>${money(s.p19)} ₸</strong></div><div><span>20.10</span><strong>${money(s.p20)} ₸</strong></div><div><span>Δ</span><strong>${signed(s.p20-s.p19)} ₸</strong></div></div><div class="detail-disclaimer">${I('info',16)} ${t('noLive')}</div>${sourceLink(SOURCE_URLS.report,'KASE · Official closing prices','detail-source')}<button class="detail-research" data-question="${s.ticker} ${state.lang==='en'?'price':state.lang==='kz'?'бағасы':'цена'}">${I('brain',16)} ${t('askNow')} ${I('arrow',17)}</button></div>`}
function renderMarket(){let stocks=filteredStocks();return `<div class="content-page"><div class="page-heading"><div class="eyebrow plain">${I('pulse',17)} MARKET EXPLORER</div><h1>${formatHead(t('marketTitle'))}</h1><p>${t('marketDesc')}</p></div><div class="market-overview"><div><span class="section-kicker">KASE INDEX</span><strong>${money(INDEX.value)}</strong><span class="negative">${signed(INDEX.percent)}% <small>20.10.2026</small></span></div><div><span class="section-kicker">CONSTITUENTS</span><strong>${STOCKS.length}</strong><span class="sub-value">KASE Index · 2026</span></div><div><span class="section-kicker">TRADING VOLUME</span><strong>${money(INDEX.volumeMlnKzt,1)} <small>млн ₸</small></strong><span class="sub-value">20.10.2026</span></div></div><div class="market-layout"><section class="stock-list-pane"><div class="stock-tools"><label class="stock-search">${I('search',17)}<input id="stockFilter" value="${esc(state.filter)}" placeholder="${t('marketSearch')}"/></label><div class="sort-switch"><button data-sort="change" class="${state.sort==='change'?'selected':''}">${t('sortChange')}</button><button data-sort="alpha" class="${state.sort==='alpha'?'selected':''}">A–Z</button></div></div><div class="stock-header"><span>${t('tableName')}</span><span>${t('tablePrice')}</span><span>${t('tableChange')}</span></div><div class="stock-rows">${stocks.length?stocks.map(s=>`<button class="stock-row ${s.ticker===state.detail?'selected':''}" data-stock="${s.ticker}"><span class="stock-name"><span class="stock-logo">${s.ticker.substring(0,2)}</span><span><strong>${esc(s.ticker)}</strong><small>${esc(s.name)}</small></span></span><strong class="stock-amount">${money(s.p20)}</strong>${marketBadge(s)}</button>`).join(''):`<p class="empty-list">No matching constituents</p>`}</div><div class="stock-footer">${I('shield',14)} ${t('snapshot')} · ${sourceLink(SOURCE_URLS.report,'KASE')}</div></section>${marketSelected()}</div></div>`}
function renderCompare(){let rows=comparison[state.lang];let headings=[t('bond'),t('deposit'),t('etf')];let icons=['layers','shield','pulse'];return `<div class="content-page"><div class="page-heading"><div class="eyebrow plain">${I('layers',17)} INSTRUMENT INTELLIGENCE</div><h1>${formatHead(t('compareTitle'))}</h1><p>${t('compareDesc')}</p></div><div class="compare-top">${headings.map((head,i)=>`<div class="compare-top-card"><div class="compare-i ${i===1?'turquoise':''}">${I(icons[i],24)}</div><span>0${i+1} / PRODUCT</span><h3>${head}</h3><div class="compare-sub">${['CREDIT RISK','BANK EXPOSURE','DIVERSIFIED EXPOSURE'][i]}</div></div>`).join('')}</div><div class="comparison-table"><div class="compare-thead"><span>DIMENSION</span>${headings.map(x=>`<strong>${x}</strong>`).join('')}</div>${[t('compareRow1'),t('compareRow2'),t('compareRow3'),t('compareRow4')].map((head,i)=>`<div class="compare-row"><strong>${head}</strong>${rows[i].map((item,j)=>`<span class="${i===2?(j===1?'comp-good':'comp-caution'):''}">${esc(item)}</span>`).join('')}</div>`).join('')}</div><div class="compare-note"><span>${I('info',20)}</span><div><strong>${t('sourcePolicyTitle')}</strong><p>${t('noLive')} ${t('notes')}</p><div class="linked-sources">${sourceLink(SOURCE_URLS.kdif,'КФГД')}${sourceLink(SOURCE_URLS.howToInvest,'KASE · guide')}</div></div></div><button class="action-btn primary compare-action" data-question="${state.lang==='en'?'Bonds vs deposits':state.lang==='kz'?'Облигация мен депозит':'Чем отличаются облигации и депозиты?'}">${t('askNow')} ${I('arrow',17)}</button></div>`}
function renderRisk(){const s=STOCKS.find(x=>x.ticker===state.riskTicker);const r=simulate({capital:state.capital,allocation:state.allocation,shock:state.shock,price:s.p20});const max=Math.max(state.capital,r.ending,1);let pnlClass=r.pnl>0?'positive':r.pnl<0?'negative':'neutral';return `<div class="content-page"><div class="page-heading"><div class="eyebrow plain">${I('flask',17)} SCENARIO LABORATORY</div><h1>${formatHead(t('riskTitle'))}</h1><p>${t('riskDesc')}</p></div><div class="risk-grid"><div class="risk-controls"><div class="risk-card-head"><span>01 / ${t('capital')}</span>${I('sliders',19)}</div><div class="risk-section"><label for="capital">${t('capital')}</label><div class="input-with-unit"><input type="number" id="capital" min="1000" max="50000000" step="1000" value="${state.capital}"/><span>KZT</span></div></div><div class="risk-section"><label for="riskTicker">${t('asset')}</label><select id="riskTicker">${STOCKS.map(x=>`<option value="${x.ticker}" ${state.riskTicker===x.ticker?'selected':''}>${x.ticker} — ${x.name}</option>`).join('')}</select><div class="risk-source-tip">${t('snapshot')} · ${money(s.p20)} ₸</div></div><div class="risk-section"><div class="range-header"><label for="allocation">${t('allocation')}</label><strong>${state.allocation}%</strong></div><input type="range" id="allocation" min="0" max="100" step="5" value="${state.allocation}"/><div class="range-ends"><span>0%</span><span>100%</span></div></div><div class="risk-section"><div class="range-header"><label for="shock">${t('shock')}</label><strong class="${state.shock<0?'negative':'positive'}">${signed(state.shock,0)}%</strong></div><input type="range" id="shock" min="-50" max="50" step="1" value="${state.shock}"/><div class="range-ends"><span>−50%</span><span>+50%</span></div></div><div class="risk-restart"><button data-action="risk-reset">${I('refresh',16)} RESET SCENARIO</button></div></div><div class="risk-output"><div class="risk-card-head"><span>02 / SCENARIO OUTPUT</span>${pill('SIMULATION','green')}</div><div class="scenario-pnl"><span>${t('scenarioResult')}</span><strong class="${pnlClass}">${r.pnl>0?'+':''}${money(r.pnl)} <small>₸</small></strong><p>${signed(state.capital>0?r.pnl/state.capital*100:0)}% ${state.lang==='en'?'of initial capital':state.lang==='kz'?'бастапқы капиталдан':'от начального капитала'}</p></div><div class="scenario-chart"><div class="bar-label"><span>${t('initialValue')}</span><b>${money(state.capital,0)} ₸</b></div><div class="track"><div class="bar-before" style="width:${state.capital/max*100}%"></div></div><div class="bar-label second"><span>${t('futureValue')}</span><b>${money(r.ending,0)} ₸</b></div><div class="track"><div class="bar-after ${r.pnl<0?'loss':''}" style="width:${r.ending/max*100}%"></div></div></div><div class="scenario-mini"><div><small>${t('stocksPurchased')}</small><strong>${r.shares.toLocaleString('ru-RU')}</strong></div><div><small>INVESTED</small><strong>${money(r.invested,0)} ₸</strong></div><div><small>CASH</small><strong>${money(r.cash,0)} ₸</strong></div><div><small>PRICE AFTER SHOCK</small><strong>${money(r.newPrice)} ₸</strong></div></div><div class="simulation-note">${I('shield',20)}<p>${t('notes')}</p></div></div></div><div class="risk-formula"><span>THE MODEL</span><code>shares = floor((capital × allocation) / close_price)</code><code>P&amp;L = shares × close_price × hypothetical_change</code>${sourceLink(SOURCE_URLS.report,'KASE · prices')}</div></div>`}
function renderSources(){return `<div class="content-page"><div class="page-heading"><div class="eyebrow plain">${I('shield',17)} TRACEABILITY & TRUST</div><h1>${formatHead(t('sourceTitle'))}</h1><p>${t('sourceDesc')}</p></div><div class="source-hero"><div class="source-hero-icon">${I('shield',33)}</div><div><div class="section-kicker">EVIDENCE PROTOCOL / VERSION 1</div><h3>${t('sourcePolicyTitle')}</h3><div class="source-policy"><p>${I('check',16)} ${t('policy1')}</p><p>${I('check',16)} ${t('policy2')}</p><p>${I('check',16)} ${t('policy3')}</p></div></div></div>${PUBLIC_DEMO?`<div class="knowledge-manager demo-studio"><div class="knowledge-head"><div><span class="section-kicker">KNOWLEDGE STUDIO · READ ONLY</span><h3>${esc(demoStatus())}</h3><p>${esc(demoMessage())}</p></div><span class="knowledge-marker">ONLINE AI</span></div></div>`:`<div class="knowledge-manager"><div class="knowledge-head"><div><span class="section-kicker">KNOWLEDGE STUDIO</span><h3>Добавить официальный документ без изменения кода</h3><p>Вставьте небольшой проверенный фрагмент из публичного источника. Он будет доступен AI Research сразу после сохранения. Добавленный текст отмечается как материал пользователя, а не автоматически проверенный факт.</p></div><span class="knowledge-marker">LOCAL · D DRIVE</span></div><form id="sourceImportForm" class="knowledge-form"><input id="docTitle" required maxlength="140" minlength="6" placeholder="Название источника, например: KASE — раскрытие информации"/><input id="docUrl" type="url" required placeholder="https://kase.kz/ru/..."/><textarea id="docText" required minlength="80" maxlength="12000" rows="5" placeholder="Скопируйте важный текст документа (от 80 символов). Не добавляйте личные данные."></textarea><button class="action-btn primary" type="submit">Добавить в знания ${I('arrow',16)}</button><span id="importStatus" aria-live="polite"></span></form></div>`}<div class="source-list-heading"><span>${SOURCES.length} VERIFIED PUBLIC REFERENCES</span><span>RESEARCH: 21.10.2026</span></div><div class="source-list">${SOURCES.map((s,i)=>`<div class="source-item"><div class="source-order">${String(i+1).padStart(2,'0')}</div><div class="source-main"><span class="source-org">${esc(s.org)} <span>•</span> ${esc(s.type)}</span><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p><div class="source-bottom">${I('clock',14)} ${esc(s.date)} ${I('shield',14)} PUBLIC PAGE</div></div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="source-out" aria-label="${t('sourceVisit')}">${I('source',19)}</a></div>`).join('')}</div><div class="sources-disclaimer">${I('info',22)}<p>${t('footer')} ${t('noLive')} ${t('policy3')}</p></div></div>`}
function renderView(){switch(state.view){case 'research':return renderResearch();case 'market':return renderMarket();case 'compare':return renderCompare();case 'risk':return renderRisk();case 'sources':return renderSources();default:return renderOverview();}}
function mount(opts={}){let prev=$('#mainContent');let pos=opts.preserveScroll?window.scrollY:0;document.documentElement.lang=state.lang==='kz'?'kk':state.lang;$('#app').innerHTML=shell();bind();if(opts.preserveScroll)window.scrollTo(0,pos);else window.scrollTo({top:0,behavior:'instant'});}
function switchView(view){state.view=view;state.mobile=false;mount();}
let requestSerial=0;
async function ask(question){
 const q=String(question??'').trim();if(!q)return;
 if(PUBLIC_DEMO&&!PUBLIC_AI){
  state.question=q;state.reply=null;state.error=demoStatus()+'. '+demoMessage();
  state.mode='simple';state.view='research';state.mobile=false;
  state.responding=false;state.aiStatus='offline';mount();return;
 }
 const serial=++requestSerial,lang=state.lang;
 state.question=q;state.reply=null;state.error='';state.mode='simple';state.view='research';state.mobile=false;
 state.responding=true;state.aiStatus='loading';mount();
 try{
  if(location.protocol==='file:')throw Error('Standalone demo cannot access local backend');
  const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,lang})});
  if(!res.ok){const details=await res.json().catch(()=>null);throw Error(details?.error||'Online AI backend unavailable');}
  const payload=await res.json();
  if(serial!==requestSerial)return;
  state.reply=payload.reply||state.reply;
  state.aiStatus=['ollama','ollama-general','cloud-ai'].includes(payload.mode)?'ready':payload.mode==='evidence-only'?'offline':'safe';
  state.aiModel=payload.mode==='cloud-ai'?'CLOUD MODEL · RAG':payload.mode==='ollama'?'QWEN3 · RAG':payload.mode==='ollama-general'?'QWEN3 · GENERAL / UNVERIFIED':payload.mode==='calculated'?'VERIFIED CALCULATION':payload.mode==='insufficient'?'DATA GAP':payload.mode==='guardrail'?'SAFETY CHECK':payload.mode==='out-of-scope'?'SCOPE CHECK':payload.mode==='boundary'?'FORECAST BOUNDARY':payload.mode==='evidence-only'?'SOURCE EXCERPTS':payload.model||'';
 }catch(err){if(serial!==requestSerial)return;state.aiStatus='offline';state.error=(state.lang==='en'?'Online AI temporarily unavailable: ':state.lang==='kz'?'Онлайн ЖИ уақытша қолжетімсіз: ':'Онлайн AI пока недоступен: ')+String(err?.message||'Service unavailable');}
 finally{if(serial===requestSerial){state.responding=false;mount();setTimeout(()=>$('#chatScroll')?.scrollTo({top:9999,behavior:'smooth'}),50);}}
}
function handleAction(action){if(action==='menu'){state.mobile=!state.mobile;mount({preserveScroll:true});return;}if(action==='go-research'){switchView('research');return;}if(action==='copy-answer'&&state.reply){let r=state.reply,txt=`${r.head}\n${r.fact}\n${state.mode==='deep'?r.deep:r.plain}\n\nSources:\n${r.sources.map(s=>s.label+': '+s.url).join('\n')}${r.kind==='market'?`\nHistorical snapshot: ${dateText}`:''}\nNot investment advice.`;navigator.clipboard?.writeText(txt).then(()=>toast(t('copied'))).catch(()=>toast('Copy unavailable'));return;}if(action==='risk-reset'){state.capital=200000;state.allocation=65;state.shock=-15;state.riskTicker='AIRA';mount({preserveScroll:true});return;}}
function bind(){
 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
 document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>ask(b.dataset.question)));
 document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;saveLang(state.lang);if(state.question){state.reply=null;state.error='Вопрос нужно задать повторно на выбранном языке.';}requestSerial++;state.responding=false;state.aiStatus='idle';mount({preserveScroll:true})}));
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action)));
 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;let y=$('#chatScroll')?.scrollTop||0;mount({preserveScroll:true});if($('#chatScroll'))$('#chatScroll').scrollTop=y;}));
 $('#askForm')?.addEventListener('submit',e=>{e.preventDefault();ask($('#askInput').value)});
 $('#sourceImportForm')?.addEventListener('submit',async e=>{e.preventDefault();const status=$('#importStatus');const form=e.currentTarget;const payload={title:$('#docTitle').value,url:$('#docUrl').value,text:$('#docText').value};status.textContent='Сохраняем документ…';try{const r=await fetch('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось добавить');form.reset();status.textContent=`Добавлено! В библиотеке ${data.documents} записей. Можешь задать AI вопрос об этом документе.`;}catch(err){status.textContent='Ошибка: '+err.message;}});

 $('#stockFilter')?.addEventListener('input',e=>{state.filter=e.target.value;const input=e.target, pos=input.selectionStart;mount({preserveScroll:true});$('#stockFilter')?.focus();$('#stockFilter')?.setSelectionRange(pos,pos)});
 document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{state.sort=b.dataset.sort;mount({preserveScroll:true})}));
 document.querySelectorAll('[data-stock]').forEach(b=>b.addEventListener('click',()=>{state.detail=b.dataset.stock;mount({preserveScroll:true})}));
 $('#capital')?.addEventListener('change',e=>{state.capital=Math.min(50000000,Math.max(1000,Number(e.target.value)||1000));mount({preserveScroll:true})});
 $('#riskTicker')?.addEventListener('change',e=>{state.riskTicker=e.target.value;mount({preserveScroll:true})});
 $('#allocation')?.addEventListener('input',e=>{state.allocation=Number(e.target.value);refreshRisk()});
 $('#shock')?.addEventListener('input',e=>{state.shock=Number(e.target.value);refreshRisk()});
}
function refreshRisk(){let scrollY=window.scrollY;let riskParent=$('.risk-grid');if(!riskParent)return;let inputFocus=document.activeElement?.id;const tmp=document.createElement('div');tmp.innerHTML=renderRisk();let newGrid=tmp.querySelector('.risk-grid');riskParent.replaceWith(newGrid);let newFormula=tmp.querySelector('.risk-formula');$('.risk-formula')?.replaceWith(newFormula);bindRiskOnly();if(inputFocus==='allocation'||inputFocus==='shock')$('#'+inputFocus)?.focus();window.scrollTo(0,scrollY);}
function bindRiskOnly(){ $('#capital')?.addEventListener('change',e=>{state.capital=Math.min(50000000,Math.max(1000,Number(e.target.value)||1000));mount({preserveScroll:true})});$('#riskTicker')?.addEventListener('change',e=>{state.riskTicker=e.target.value;mount({preserveScroll:true})});$('#allocation')?.addEventListener('input',e=>{state.allocation=Number(e.target.value);refreshRisk()});$('#shock')?.addEventListener('input',e=>{state.shock=Number(e.target.value);refreshRisk()});$('[data-action="risk-reset"]')?.addEventListener('click',()=>handleAction('risk-reset'));}
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.view!=='research')switchView('research');$('#askInput')?.focus();}if(e.key==='Escape'&&state.mobile){state.mobile=false;mount({preserveScroll:true})}});
mount();

  </script>
